# Matches both nginx limit_req and limit_conn rejections.
# The filter shipped with fail2ban (nginx-limit-req) only knows limit_req,
# but scanner bursts are mostly stopped by limit_conn.
# Copy to /etc/fail2ban/filter.d/odoo-nginx-limit.conf.

[Definition]
failregex = ^\s*\[[a-z]+\] \d+#\d+: \*\d+ limiting (?:requests, excess: [\d.]+|connections) by zone "[^"]+", client: <HOST>,
ignoreregex =
datepattern = {^LN-BEG}
