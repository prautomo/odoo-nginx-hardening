# Odoo behind nginx, hardened against scanner bursts.
# Replace odoo.example.com and the certificate paths.
# Needs nginx/conf.d/odoo-limits.conf and nginx/snippets/odoo-proxy.conf.
#
# Odoo 12-15: real-time bus is /longpolling.  Odoo 16+: it is /websocket
# (see the commented block below). Both go to the gevent port 8072, which
# only exists when Odoo runs with workers > 0.

upstream odoo {
    server 127.0.0.1:8069;
    keepalive 32;
}

upstream odoo_bus {
    server 127.0.0.1:8072;
}

server {
    listen 80;
    listen [::]:80;
    server_name odoo.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx < 1.25.1. On newer versions use "listen 443 ssl;" plus "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odoo.example.com;

    ssl_certificate     /etc/letsencrypt/live/odoo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odoo.example.com/privkey.pem;

    access_log /var/log/nginx/odoo.access.log;
    # "warn" is required: limit messages are logged at warn level and
    # fail2ban reads them from here.
    error_log  /var/log/nginx/odoo.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 200m;
    proxy_read_timeout 720s;
    proxy_send_timeout 720s;

    # 1. Scanner junk is dropped here and never costs Odoo a database
    #    connection. Odoo itself serves none of these paths.
    location ~ /\.(?!well-known/) { return 444; }               # .env, .git, .aws ...
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }
    location ~* ^/(wp-admin|wp-includes|wp-content|wp-login|xmlrpc\.php|cgi-bin|phpmyadmin|pma|vendor/phpunit)(/|$) {
        return 444;
    }

    # 2. The database manager must never be public.
    location ~* ^/web/database { return 404; }

    # 3. Login: slow down password guessing (POST only, see odoo-limits.conf).
    location = /web/login {
        limit_req  zone=odoo_login burst=10 nodelay;
        limit_req  zone=odoo_req   burst=200 nodelay;
        limit_conn odoo_conn 40;
        include snippets/odoo-proxy.conf;
        proxy_pass http://odoo;
    }

    # 4. Real-time bus: one long-held connection per open browser tab, so it
    #    is not counted in limit_conn.
    location /longpolling {
        include snippets/odoo-proxy.conf;
        proxy_pass http://odoo_bus;
    }
    # Odoo 16+:
    # location /websocket {
    #     include snippets/odoo-proxy.conf;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_pass http://odoo_bus;
    # }

    # 5. Everything else.
    location / {
        limit_req  zone=odoo_req burst=200 nodelay;
        limit_conn odoo_conn 40;
        include snippets/odoo-proxy.conf;
        proxy_pass http://odoo;
    }

    # Static files need no database, so they skip limit_conn and can be
    # cached by browsers.
    location ~* ^/[^/]+/static/ {
        limit_req zone=odoo_req burst=200 nodelay;
        include snippets/odoo-proxy.conf;
        expires 24h;
        proxy_pass http://odoo;
    }
}
