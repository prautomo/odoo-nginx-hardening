# Reject every request that does not ask for a hostname we serve.
# Scanners mostly hit raw IP addresses; with this file they get nothing,
# not even a TLS certificate that reveals the hostname.
# Requires nginx >= 1.19.4 (ssl_reject_handshake).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;    # close the connection without a response
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
