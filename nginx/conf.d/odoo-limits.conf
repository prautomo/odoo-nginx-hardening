# Rate and connection limits for Odoo (http context).
# Copy to /etc/nginx/conf.d/odoo-limits.conf.

# Trusted IPs that are never limited, e.g. the client's office NAT where
# many users share one public address. Add one line per IP or CIDR.
geo $odoo_limit_exempt {
    default 0;
    # 203.0.113.10 1;   # office NAT
}

# An empty key means "do not count this request".
map $odoo_limit_exempt $odoo_limit_key {
    0 $binary_remote_addr;
    1 "";
}

# Only POSTs to /web/login count towards the login limit.
map $request_method $odoo_login_key {
    POST    $odoo_limit_key;
    default "";
}

# General traffic: 20 requests/second per IP, with a burst allowance set
# per location. An Odoo page load fires many requests at once (assets, RPC
# calls, avatars), so keep the burst generous.
limit_req_zone  $odoo_limit_key zone=odoo_req:10m   rate=20r/s;

# Login attempts: 10 per minute per IP.
limit_req_zone  $odoo_login_key zone=odoo_login:10m rate=10r/m;

# Concurrent connections per IP. This is the setting that protects the
# Odoo database pool: keep it well below db_maxconn (64 by default).
limit_conn_zone $odoo_limit_key zone=odoo_conn:10m;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;
